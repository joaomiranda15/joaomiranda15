name: Generate Datas
on:
  schedule: # execute every 2 hours
    - cron: "0 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: joaomiranda15
          outputs: |
            dist/github-contribution-grid-snake.svg
      - name: Slow down the snake animation
        run: |
          sed -i -E 's/dur="([0-9.]+)s"/echo "dur=\"$(echo "\1 * 2" | bc)s\""/ge' dist/github-contribution-grid-snake.svg
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
